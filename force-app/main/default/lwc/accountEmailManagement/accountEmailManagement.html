<template>
    <lightning-card class="cards">

        <!-- Spinner -->
        <template if:true={loading}>
            <lightning-spinner variant="brand" alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- HEADER TITLE -->
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12">
                <div style="width:100%">
                    <label class="slds-text-heading_medium slds-align_absolute-center slds-text-b">
                        <b>Account Management</b>
                    </label>
                </div>
            </lightning-layout-item>
        </lightning-layout>

        <div class="slds-m-around_xx-small">

            <!-- ACTIONS ROW -->
            <div
                style="width: 100%; display: flex; flex-direction: row; justify-content: space-between; margin-bottom: 1%; margin-top: 1%;">

                <!-- Page Size -->
                <div style="width: 25%; display: flex; flex-direction: row; align-items: center;">
                    <span style="font-weight: bold">Page Size : &nbsp;</span>
                    <lightning-combobox variant="label-hidden" style="width: 30%" label="Page Size" value={pageSize}
                        options={pageSizeOptions} onchange={handlePageSizeChange}>
                    </lightning-combobox>
                </div>

                <!-- Search -->
                <!-- <div onkeyup={handleSearch} style="width: 40%;">
                    <div style="text-align:right">
                        <lightning-input variant="label-hidden" name="enter-search"
                            placeholder="Press 'Enter' key to Search Account"
                            type="search" style="width: 70%;">
                        </lightning-input>
                    </div>
                </div> -->
                <div style="width: 40%; display: flex; justify-content: center; align-items: center;">
                    <!-- <div style="width: 70%;"> -->
                        <!-- <div style="text-align:right"> -->
                            <lightning-input variant="label-hidden" name="enter-search" placeholder="Search Account..."
                                type="search" style="width: 70%;" onchange={handleSearchChange}>
                            </lightning-input>
                        <!-- </div> -->
                    <!-- </div> -->
                </div>

                <!-- Buttons -->
                <div style="width: 25%; text-align: right;">
                    <lightning-button label="Download CSV" icon-name="utility:download" class="slds-m-right_small"
                        onclick={downloadCSV}></lightning-button>

                    <lightning-button label="Upload CSV" icon-name="utility:upload"
                        onclick={openCSVUpload}></lightning-button>

                    <input type="file" data-id="csvUploader" accept=".csv" style="display:none" onchange={uploadCSV}>
                </div>
            </div>

            <!-- ACCOUNT TABLE -->
            <table class="slds-table slds-table_bordered slds-border_left slds-border_right tableCls_customer_ledger">
                <thead>
                    <tr>
                        <th style="background-color:#642156;color:#fff;">
                            <div class="slds-truncate">Account Name</div>
                        </th>
                        <th style="background-color:#642156;color:#fff;">
                            <div class="slds-truncate">Account Id</div>
                        </th>
                        <th style="background-color:#642156;color:#fff;">
                            <div class="slds-truncate">BMID</div>
                        </th>
                        <th style="background-color:#642156;color:#fff; text-align:center;">
                            <div class="slds-truncate">Edit</div>
                        </th>
                    </tr>
                </thead>

                <tbody>
                    <template for:each={recordsToDisplay} for:item="acc">
                        <tr key={acc.Id}>
                            <td>{acc.Name}</td>
                            <td>{acc.Id}</td>
                            <td>{acc.Bureau_Member_Id__c}</td>

                            <td style="text-align:center">
                                <lightning-icon 
                                    icon-name="utility:edit" 
                                    size="x-small"
                                    data-id={acc.Id}
                                    onclick={openEditModal}>
                                </lightning-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <div style="margin: auto; text-align: center; display: flex; justify-content: center">
                <lightning-button style="margin: 1%" variant="brand" icon-name="utility:back" label="Prev"
                    onclick={previousPage} disabled={disablePrev}>
                </lightning-button>

                <div style="border-radius: 5px; border: 1px solid gray; margin: 1%; padding: 0.4% 1%">
                    {start} - {end} of {totalRecords} | page {page} of {totalPages}
                </div>

                <lightning-button style="margin: 1%" variant="brand" icon-name="utility:forward" icon-position="right"
                    label="Next" onclick={nextPage} disabled={disableNext}>
                </lightning-button>
            </div>

        </div>

        <!-- EDIT MODAL -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Edit Email</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">DA Level 1</h3>

                        <div class="slds-grid slds-wrap">
                            <template for:each={daLevel1List} for:item="field">
                                <div key={field.api} class="slds-col slds-size_1-of-2 slds-p-around_x-small">

                                    <lightning-input 
                                        label={field.label}
                                        value={field.value}
                                        data-api={field.api}
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                </div>
                            </template>
                        </div>

                        <h3 class="slds-text-heading_small slds-m-bottom_small">DA Level 2</h3>

                        <div class="slds-grid slds-wrap">
                            <template for:each={daLevel2List} for:item="field">
                                <div key={field.api} class="slds-col slds-size_1-of-2 slds-p-around_x-small">

                                    <lightning-input 
                                        label={field.label}
                                        value={field.value}
                                        data-api={field.api}
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                </div>
                            </template>
                        </div>

                        <h3 class="slds-text-heading_small slds-m-bottom_small">DA Level 3</h3>

                        <div class="slds-grid slds-wrap">
                            <template for:each={daLevel3List} for:item="field">
                                <div key={field.api} class="slds-col slds-size_1-of-2 slds-p-around_x-small">

                                    <lightning-input 
                                        label={field.label}
                                        value={field.value}
                                        data-api={field.api}
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                </div>
                            </template>
                        </div>
        
                    </div>

                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={updateEmail}>Save</button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
