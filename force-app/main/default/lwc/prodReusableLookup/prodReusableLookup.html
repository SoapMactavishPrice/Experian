<template>
    <div class="slds-form-element">
        <div class="slds-form-element__control">

            <!-- Show Search Input When No Value Selected -->
            <template if:false={isValueSelected}>
                <div class="slds-combobox_container">
                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                            role="none">
                            <!-- field-level-help={helpText} -->
                            <lightning-input type="search" label={label} required={required} 
                                placeholder={placeholder} onchange={handleChange} onblur={handleInputBlur} variant="label-hidden"
                                value={value} name={name} data-id={id} data-index={index}
                                autocomplete="off">
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Show Selected Value -->
            <template if:true={isValueSelected}>
                <div class="slds-combobox_container slds-has-selection" tabindex="0">
                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                        <div data-key="pilldiv"
                          class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                          role="none">
                            <span
                                class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon"
                                title="Account">
                                <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
                                    size="x-small"></lightning-icon>
                            </span>

                            <button type="button"
                                class="slds-input_faux slds-combobox__input slds-combobox__input-value"
                                aria-labelledby="combobox-label-id-35 combobox-id-5-selected-value"
                                id="combobox-id-5-selected-value" aria-controls="listbox-id-5" aria-expanded="false"
                                aria-haspopup="listbox">
                                <span class="slds-truncate" id="combobox-value-id-19">{selectedRecordName}</span>
                            </button>


                            <!-- Right "remove" icon button -->
                            <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                title="Remove selected option" aria-label="Remove selected option"
                                onclick={handleCommit}>
                                <lightning-icon icon-name="utility:close" alternative-text="Remove selected option"
                                    size="x-small"></lightning-icon>
                            </button>

                        </div>
                    </div>
                </div>
            </template>

            <!-- Show Recent Records -->
            <template if:true={showRecentRecords}>
                <div id="listbox-id-4" tabindex="0" role="listbox" onblur={handleBlur} onmousedown={handleDivClick}
                    class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid">

                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                        <template for:each={recordsList} for:item="rec">
                            <li key={rec.id} class="slds-listbox__item" role="presentation">
                                <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                    onclick={handleSelect} data-id={rec.id} data-mainfield={rec.mainField}
                                    data-subfield={rec.subField} role="option">

                                    <span class="slds-media__figure slds-listbox__option-icon">
                                        <lightning-icon icon-name={selectedIconName} alternative-text={selectedIconName}
                                            size="small"></lightning-icon>
                                    </span>

                                    <span class="slds-media__body">
                                        <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                                            <mark>{rec.mainField}</mark>
                                        </span>
                                        <span if:true={rec.subField} class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                            {objectLabel} • {rec.subField}
                                        </span>
                                    </span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

        </div>
    </div>
</template>
