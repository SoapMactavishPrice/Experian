                    <template if:true={showToast1}>

    </lightning-card>


    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" class="slds-modal__close"
                        onclick={closeModal}></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Add IP Address</h2>
                </header>

                <!-- Body -->

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-align_absolute-center slds-m-bottom_small">
                        <lightning-combobox style="width:20%" name="ipType" label="IP Type" value={selectedType}
                            placeholder="Select Type" options={ipTypes} onchange={handleTypeChange}>
                        </lightning-combobox>
                    </div>
               

                <template if:true={showToast2}>
                    <div class="slds-m-bottom_small" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <span style="color: red;">{toastMessage2}</span>
                    </div>
                </template>




                <table class="customTable slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead style="background-color: #e076e4;">
                        <tr class="slds-line-height_reset">

                            <th scope="col" style="background-color: #eeeeee;">
                                <div class="slds-truncate">From IP</div>
                            </th>
                            <th if:true={isRange} scope="col" style="background-color: #eeeeee;">
                                <div class="slds-truncate">To IP</div>
                            </th>
                            <th if:true={isSignle} scope="col" style="background-color: #eeeeee;">
                                <div class="slds-truncate">Action</div>
                            </th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Secondary: -->
                        <template for:each={currentIpList} for:item="rec" for:index="index">
                            <tr key={rec.index} class="slds-hint-parent">

                                <td>
                                    <lightning-input value={rec.fromIp} name="fromIp" data-label="Form_C_Secondary"
                                        onchange={handleIPChange} variant="label-hidden" data-id={rec.index}>
                                    </lightning-input>
                                </td>
                                <td if:true={isRange}>
                                    <lightning-input value={rec.fromToIp} name="fromToIp" data-label="Form_C_Secondary"
                                        onchange={handleIPChange} variant="label-hidden" data-id={rec.index}>
                                    </lightning-input>
                                </td>

                                <td if:true={isSignle}>

                                    <lightning-icon icon-name="action:new" size="xx-small" class="slds-m-right_xx-small"
                                        data-index={rec.index} data-label={currentIpvarLabel}
                                        data-user-role={rec.userRole} onclick={addRow_IpFunction}>
                                    </lightning-icon>
                                    <lightning-icon icon-name="action:remove" data-label={currentIpvarLabel}
                                        size="xx-small" data-index={rec.index} onclick={removeRow_IpFunction}>
                                    </lightning-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>

                </table>
                </div>
           

            <!-- Footer -->
            <footer class="slds-modal__footer">
                <div class="slds-align_absolute-center">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Add IP's" class="slds-m-left_small"
                        data-pindex={parnetIndex} data-label={currentIpvarLabel} onclick={handleAddIps}>
                    </lightning-button>
                </div>
            </footer>
            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
