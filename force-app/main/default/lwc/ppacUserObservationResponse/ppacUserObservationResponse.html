<template>

    <lightning-card title="PPAC Observation Response">

        <div class="slds-p-around_medium">

            <div class="detail-box">

                <p><b>PPAC ID:</b> {ppacId}</p>
                <p><b>PPAC Name:</b> {ppacName}</p>
                <p><b>Business Unit:</b> {subCategory}</p>
                <p><b>Submitted By:</b> {submittedBy}</p>

            </div>

            <template if:true={observations.length}>

                <h3
                    class="slds-text-heading_small
                           slds-m-top_large">

                    Observation History

                </h3>

                <lightning-datatable
                    key-field="Id"
                    data={observations}
                    columns={columns}>
                </lightning-datatable>

            </template>

            <lightning-textarea
                label="Response"
                value={response}
                onchange={handleChange}>
            </lightning-textarea>

            <div
                class="slds-m-top_medium
                       slds-align_absolute-center">

                <lightning-button
                    variant="brand"
                    label="Submit Response"
                    onclick={handleSubmit}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
