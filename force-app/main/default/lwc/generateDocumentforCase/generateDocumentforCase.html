<template>
    <lightning-card>
        <lightning-layout class="slds-m-around_small" multiple-rows>
            <lightning-layout-item size="12" large-device-size="12">
                <label class="slds-text-heading_medium slds-align_absolute-center">Generate Document</label>
            </lightning-layout-item>

            <lightning-layout-item size="12" large-device-size="3"></lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="4"
                class="slds-m-around_small slds-align_absolute-center">
                <div style="display:flex">
                    <label class="slds-m-top_xx-small">Select Case</label>
                    <c-lookup-component lookup-label="Select Case" label="Select Case" show-icon="true"
                        class="slds-m-left_small" object-api-name="Case" icon-name="standard:account"
                        data-label="selectGroup" onrecordselection={onMasterSelection}
                        selected-record-id={selectedGroupId}>
                    </c-lookup-component>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="12" large-device-size="4" class="slds-m-top_x-small">
                <lightning-button label="Download" class="slds-m-top_x-small" variant="brand" disabled={checkCasesSize}
                    onclick={download_Document}></lightning-button>
                <lightning-button label="Cancel" class="slds-m-top_x-small slds-m-left_x-small" variant="brand"
                    onclick={handleCancel}></lightning-button>
            </lightning-layout-item>

        </lightning-layout>

        <table if:false={checkCasesSize}
            class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-left_large slds-m-right_large slds-m-top_xx-small"
            style="width: 75%;margin-left: 13%;">
            <thead>
                <tr>
                    <td scope="col" style="background-color: rgb(99, 24, 86);color: white;text-align: center;">
                        Case
                        Number</td>
                    <td scope="col" style="background-color: rgb(99, 24, 86);color: white;text-align: center;">
                        Case
                        Subject</td>
                    <td scope="col" style="background-color: rgb(99, 24, 86);color: white;text-align: center;">
                        Case
                        Category</td>
                    <td scope="col" style="background-color: rgb(99, 24, 86);color: white;text-align: center;">
                        Case
                        Status</td>
                    <td scope="col" style="background-color: rgb(99, 24, 86);color: white;text-align: center;">
                        remove</td>

                </tr>

            </thead>
            <tbody>
                <template for:each={caseList} for:item="item" for:index="index">
                    <tr key={item.Id}>
                        <td style="text-align: center">
                            {item.CaseNumber}
                        </td>
                        <td style="text-align: center">
                            {item.Subject}
                        </td>
                        <td style="text-align: center">
                            {item.Category}
                        </td>
                        <td style="text-align: center">
                            {item.Status}
                        </td>
                        <td style="text-align: center">
                            <lightning-button-icon icon-name="utility:close" alternative-text="remove case"
                                class="slds-m-left_small slds-align_absolute-center" size="x-small" data-id={item.Id}
                                onclick={handleaddRemoveCases}>
                            </lightning-button-icon>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

    </lightning-card>


</template>
