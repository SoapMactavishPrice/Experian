<template>
    <lightning-layout multiple-rows class="slds-grid_vertical-align-center slds-grid_align-spread">
        <lightning-layout-item size="12" small-device-size="4" medium-device-size="3" large-device-size="4"
            padding="around-small">
            <!--RECORDS PER PAGE-->
            <div style={controlPagination} class="slds-list_inline slds-p-bottom_xx-small customSelect">
                <label class="slds-text-color_weak slds-p-horizontal_x-small" for="recordsPerPage">Records Per
                    Page:</label>
                <div class="slds-select_container">
                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option} style="width:60px">{option}</option>
                        </template>
                    </select>
                </div>
            </div>
        </lightning-layout-item>
        <lightning-layout-item size="12" small-device-size="4" medium-device-size="4" large-device-size="4"
            padding="around-small">
            <!--SEARCH BOX-->
            <div if:true={showSearchBox}>
                <div class="slds-p-horizontal_x-small slds-p-bottom_xx-small" >
                    <lightning-input label="" type="search" placeholder="Search by any Column Value (Case Sensitive)" variant="label-hidden"
                        onchange={handleKeyChange}></lightning-input>
                </div>
            </div>
        </lightning-layout-item>
        <lightning-layout-item size="12" small-device-size="4" medium-device-size="4" large-device-size="4"
            padding="around-small" style="text-align: right">
            <!--PAGE NAVIGATION-->
            <div style="text-align:right">
            <div style={controlPagination}>
                <div class="slds-col slds-p-bottom_xx-small">
                    <span style={controlPrevious}>
                        <lightning-button-icon icon-name="utility:left" variant="bare" size="medium"
                            alternative-text="Previous Page" onclick={previousPage}></lightning-button-icon>
                    </span>
                    <label class="slds-text-color_weak slds-p-horizontal_x-small" for="pageNum">Page:</label>
                    <input type="number" id="pageNum" value={pageNumber} maxlength="4" style="width:30px"
                        onkeypress={handlePageNumberChange} class="customInput" title="Go to a Page"></input>
                    <span>&nbsp;of&nbsp;<b id="totalPages">{totalPages}</b></span>
                    <span style={controlNext}>
                        <lightning-button-icon icon-name="utility:right" variant="bare" size="medium"
                            alternative-text="Next Page" onclick={nextPage} class="slds-p-horizontal_x-small">
                        </lightning-button-icon>
                    </span>
                </div>
            </div>
            </div>
        </lightning-layout-item>
    </lightning-layout>
</template>
