<template>

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" variant="brand" size="small"></lightning-spinner>
    </template>


    <lightning-card title="Daily Email Usage" icon-name="utility:email">
        <div class="slds-var-p-horizontal_medium">
            <div class="slds-text-heading_medium">
                {used} of {max} emails sent
            </div>
            <div class="slds-text-color_weak slds-var-p-vertical_x-small">
                {percentage}% of limit used
            </div>
            <lightning-progress-bar value={percentage} size="large" variant="success" class="slds-m-top_medium"></lightning-progress-bar>
        </div>
        <div slot="footer" class="slds-text-color_success">
            {remaining} emails left today
        </div>
    </lightning-card>

</template>
