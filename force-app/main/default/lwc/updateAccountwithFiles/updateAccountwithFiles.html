<template>
    
    <lightning-card>
        <label class="slds-text-heading_medium slds-align_absolute-center">Account Name Change</label><br/>
        <lightning-button label="Update Account" onclick={updateAccount} variant="brand"
            class="slds-align_absolute-center">
        </lightning-button>
    </lightning-card>

    <template if:true={openModel}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
            aria-describedby="modal-content-id-3" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closePdfPreviewModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Update Account</h2>

                </header>
                <div class="slds-modal__content slds-var-p-around_medium" id="modal-content-id-3">
                    <div style="text-align: center;">
                        <lightning-card>
                            <div if:true={showSpinner}>
                                <lightning-spinner variant="brand" alternative-text="Loading" size="medium"></lightning-spinner>
                            </div>

                            <div style="display:flex"><label style="color:red">*</label><label>New Account Name</label></div>
                            <lightning-input required="true" label="Account Name" variant="label-hidden"
                                    onchange={handleAccountName}></lightning-input><br/>
                            <div style="display:flex"><label style="color:red">*</label>Name Change</label></div>
                            <lightning-input type="file" class="slds-float_left" accept={acceptedFormats} variant="label-hidden"
                                    onchange={handleFileUploaded} label="Name Change">
                                </lightning-input>

                            <!-- <div style="display:flex">
                                <label><span style="display:flex"><p style="color:red;">*</p>Account Name</span></label>
                                <lightning-input required="true" label="Account Name" variant="label-hidden"
                                    onchange={handleAccountName}>
                                </lightning-input>
                            </div>
                            <div style="display:flex">
                                <label>
                                    <span style="display:flex"><p style="color:red;">*</p>Name Change</span></label>
                                <lightning-input type="file" accept={acceptedFormats} variant="label-hidden"
                                    onchange={handleFileUploaded} label="Name Change">
                                </lightning-input>
                            </div> -->
                        </lightning-card>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closePdfPreviewModal}
                        title="NO">Cancel</button>
                    <button class="slds-button slds-button_brand" title="Upload Image" disabled={saveDisbled}
                        onclick={SaveAccount}>Save</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
